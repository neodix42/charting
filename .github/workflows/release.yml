name: Portable release

on:
  push:
    branches: [main]

# Serialize version selection through publication. Keep queued main pushes instead
# of canceling the previous pending run; the planner skips superseded events.
concurrency:
  group: cryptodesk-main-release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the next patch version or resume this commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, windows-amd64]
    env:
      CRYPTODESK_VERSION: ${{ needs.plan.outputs.version }}
      VITE_EXPLICIT_TEST_BRIDGE: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: true
      # These packages provision only the disposable GitHub runner. Local build
      # scripts remain unprivileged and never install system dependencies.
      - name: Prepare Ubuntu desktop build dependencies
        if: matrix.target == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            glib-networking gsettings-desktop-schemas dconf-gsettings-backend \
            adwaita-icon-theme librsvg2-common libgdk-pixbuf2.0-bin libglib2.0-bin \
            gstreamer1.0-plugins-base bubblewrap xdg-dbus-proxy xvfb xauth apparmor \
            libnss3 libnspr4 libasound2t64 libxss1
      - name: Verify unprivileged portable namespace setup
        if: matrix.target == 'linux-amd64'
        run: ./scripts/ci-portable-namespace.sh --evidence "$RUNNER_TEMP/portable-smoke"
      - name: Refresh only redistributed Ubuntu runtime packages
        if: matrix.target == 'linux-amd64'
        # Hosted images can retain superseded package versions after apt update.
        # Upgrade this runtime closure so its exact sources remain in the current
        # authenticated Ubuntu indexes; never upgrade the entire runner image.
        run: |
          source scripts/common.sh
          require_node
          python3 scripts/screener_bundle.py --target linux-amd64 --destination .tools/screener-runtime-linux-amd64
          python3 scripts/linux_portable.py --list-packages --screener-runtime .tools/screener-runtime-linux-amd64 > "$RUNNER_TEMP/runtime-packages.txt"
          mapfile -t portable_packages < "$RUNNER_TEMP/runtime-packages.txt"
          (( ${#portable_packages[@]} > 0 ))
          sudo apt-get install --only-upgrade --no-install-recommends -y "${portable_packages[@]}"
      - name: Prepare Windows runtime extraction
        if: matrix.target == 'windows-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y 7zip
      - name: Verify domain, storage, frontend and packaging
        if: matrix.target == 'linux-amd64'
        run: |
          ./scripts/test.sh
          go test -race -tags webkit2_41 ./...
          go test -race -tags 'production webkit2_41' .
          go vet -tags webkit2_41 ./...
      - name: Verify browser interactions
        if: matrix.target == 'linux-amd64'
        run: |
          source scripts/common.sh
          require_node
          cd frontend
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e
      - name: Build Ubuntu x64 standard archive
        if: matrix.target == 'linux-amd64'
        run: ./build.sh
      - name: Build Linux x64 archive with bundled runtime
        if: matrix.target == 'linux-amd64'
        run: ./portable-build.sh --skip-build
      - name: Verify bundled Linux runtime without host GTK or WebKit
        if: matrix.target == 'linux-amd64'
        run: xvfb-run -a python3 scripts/smoke-portable.py "cryptodesk-$CRYPTODESK_VERSION-linux-amd64-portable.tar.gz" --evidence "$RUNNER_TEMP/portable-smoke"
      - name: Preserve portable runtime diagnostics on success or failure
        if: always() && matrix.target == 'linux-amd64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Keep diagnostics outside publish's portable-* archive selection.
          name: diagnostics-portable-linux-amd64
          path: ${{ runner.temp }}/portable-smoke/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Build Windows x64 portable ZIP with WebView2
        if: matrix.target == 'windows-amd64'
        run: ./win-build.sh
      - name: Verify the preinstalled Screener runtime in each release archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python3 - "$RELEASE_TARGET" "$CRYPTODESK_VERSION" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          import release
          target, version = sys.argv[1:]
          for variant in ([target, 'linux-amd64-portable'] if target == 'linux-amd64' else [target]):
              path = pathlib.Path(f'cryptodesk-{version}-{variant}{release.TARGETS[variant]}')
              release.archive_manifest(path, variant, version)
          PY
      - name: Stage versioned release archives
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/release.py stage --version "$CRYPTODESK_VERSION" --target "$RELEASE_TARGET" --directory "$RUNNER_TEMP/release-assets"
          if [[ "$RELEASE_TARGET" == linux-amd64 ]]; then
            python3 scripts/release.py stage --version "$CRYPTODESK_VERSION" --target linux-amd64-portable --directory "$RUNNER_TEMP/release-assets"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only this job can create a tag or modify a release. Build jobs get no write
    # credentials, and checkout never persists credentials in any job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: portable-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: Verify all three archives and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/release.py publish --version "$RELEASE_VERSION" --directory "$RUNNER_TEMP/release-assets"
